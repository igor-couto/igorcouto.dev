# Include INSIDE the existing igorcouto.com server block (root /var/www/html).
# Remove conflicting exact locations for these pages, but keep application routes.
# Relative automatic directory redirects preserve HTTPS behind a TLS proxy.
absolute_redirect off;

location = / {
    try_files /index.html =404;
}

location = /index.html {
    return 301 https://igorcouto.com/$is_args$args;
}

location = /projects {
    return 301 https://igorcouto.com/projects/$is_args$args;
}

location = /projects/index.html {
    return 301 https://igorcouto.com/projects/$is_args$args;
}

location = /projects/ {
    try_files /projects/index.html =404;
}

location = /projects/github-self-hosted-runner-manager {
    try_files /projects/github-self-hosted-runner-manager.html =404;
}
location = /projects/github-self-hosted-runner-manager.html {
    return 301 https://igorcouto.com/projects/github-self-hosted-runner-manager$is_args$args;
}
location = /projects/github-self-hosted-runner-manager/ {
    return 301 https://igorcouto.com/projects/github-self-hosted-runner-manager$is_args$args;
}

location = /projects/my-pies {
    try_files /projects/my-pies.html =404;
}
location = /projects/my-pies.html {
    return 301 https://igorcouto.com/projects/my-pies$is_args$args;
}
location = /projects/my-pies/ {
    return 301 https://igorcouto.com/projects/my-pies$is_args$args;
}

location = /projects/home-server {
    try_files /projects/home-server.html =404;
}
location = /projects/home-server.html {
    return 301 https://igorcouto.com/projects/home-server$is_args$args;
}
location = /projects/home-server/ {
    return 301 https://igorcouto.com/projects/home-server$is_args$args;
}

location = /projects/detective-bacon {
    try_files /projects/detective-bacon.html =404;
}
location = /projects/detective-bacon.html {
    return 301 https://igorcouto.com/projects/detective-bacon$is_args$args;
}
location = /projects/detective-bacon/ {
    return 301 https://igorcouto.com/projects/detective-bacon$is_args$args;
}
